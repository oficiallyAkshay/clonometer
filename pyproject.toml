[project]
name = "clonometer"
version = "0.1.0"
description = "A lifetime clone count for any repository, in a JSON file you can badge any way you like."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["github", "traffic", "clones", "badge", "shields", "github-action"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]
# Standard library only, as a policy: the script runs on a bare runner and
# through pipx or npx with nothing to resolve.
dependencies = []

[project.urls]
Repository = "https://github.com/oficiallyAkshay/clonometer"

[project.scripts]
clonometer = "clonometer:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "diff-cover==10.5.1",
    "pre-commit==4.6.2",
    "pyyaml==6.0.3",
    "drawsvg==2.4.2",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["clonometer.py"]

[tool.hatch.build.targets.sdist]
only-include = ["clonometer.py", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["clonometer", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 100
