[project]
name = "clonometer"
version = "0.1.0"
description = "A lifetime clone count for any repository, in a JSON file you can badge any way you like."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["github", "traffic", "clones", "badge", "shields", "github-action"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]
# Standard library only, as a policy: the script runs on a bare runner and
# through pipx or npx with nothing to resolve.
dependencies = []

[project.urls]
Repository = "https://github.com/oficiallyAkshay/clonometer"

[project.scripts]
clonometer = "clonometer:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.16.8",
    "diff-cover==10.5.1",
    "pre-commit==4.6.2",
    "pyyaml==6.0.3",
    "drawsvg==2.4.2",
    "deptry==0.25.1",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["clonometer.py"]

[tool.hatch.build.targets.sdist]
only-include = ["clonometer.py", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the ruff formatter
    "ISC001", # conflicts with the ruff formatter
    "T20", # the CLI and scripts print their output and status by design
    "D401", # every docstring here names a value, not a command; a deliberate house style
    "CPY001", # no per-file copyright header convention here; LICENSE covers the whole tree
    "TRY003", # one ClonometerError carries a plain message by design, one exit path prints it
    "EM101", # see TRY003: the message is built inline for that one generic exception
    "EM102", # see TRY003: the message is built inline for that one generic exception
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.pylint]
# numbers() takes 8 named figures and read_ledger() takes 6 positional ones;
# both are plain data, not a sign of a function doing too much.
max-args = 8
max-positional-args = 6

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "S101", # assert is pytest's own idiom
    "ANN", # a test's signature does not need to be a documented interface
    "ARG001", # a pytest fixture is requested by name, not always used in the body
    "PLR2004", # comparing against a literal is the point of a test assertion
    "PT018", # a composite assert reads fine as one check in a test body
    "SLF001", # a white-box test reaches into internals on purpose
    "D103", # a test's name is its documentation
    "D105", # a fake's dunder method needs no docstring of its own
    "D205", # a fake's docstring here is a label, not a summary-plus-body
    "D209", # same as D205: label-shaped docstrings on small test doubles
    "C901", # a fake HTTP server naturally branches once per endpoint it serves
]
"scripts/*" = [
    "D103", # scripts/draw_loop.py's small drawing helpers are named for what they build
]

[tool.deptry]
# The default exclude list skips "tests"; this project's dev dependencies
# (pytest, pyyaml) are used almost entirely from there, so scan it like
# every other directory instead.
exclude = ["venv", "\\.venv", "\\.direnv", "\\.git", "setup\\.py"]
# Every package under [project.optional-dependencies] is dev tooling: pytest
# and pyyaml for the test suite, ruff for linting, pre-commit and diff-cover
# for CI, drawsvg for the hero-image script. None of it ships at runtime.
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.package_module_name_map]
# The import name ('yaml') does not match the distribution name ('pyyaml').
pyyaml = "yaml"

[tool.deptry.per_rule_ignores]
# Every dev dependency here is legitimately imported from tests/ and
# scripts/, exactly where dev tooling belongs; none of this is production
# code, so DEP004 has nothing real to find on these three imports.
DEP004 = ["pytest", "yaml", "drawsvg"]

[tool.vulture]
paths = ["clonometer.py", "scripts", "tests"]
# 60 catches every stdlib-override false positive this repo has (do_GET,
# log_message, redirect_request, __exit__); 80 stays above that band while
# still catching genuine dead code.
min_confidence = 80

[tool.coverage.run]
source = ["clonometer", "scripts"]
branch = true

[tool.coverage.report]
fail_under = 100
