name: clonometer
description: A lifetime clone count for any repository, in a JSON file you can badge any way you like.
branding:
  icon: trending-up
  color: green

inputs:
  token:
    description: >-
      Fine-grained personal access token with Administration read and
      Contents write on this repository. A workflow's own GITHUB_TOKEN
      cannot be granted Administration, which is where the traffic
      endpoints sit, so this has to be a token the owner creates.
    required: true
  branch:
    description: Branch the ledger and numbers files are kept on.
    required: false
    default: badges
  metrics:
    description: Metrics to count, 'clones' or 'clones,views'.
    required: false
    default: clones
  gist:
    description: >-
      Id of a gist to mirror the numbers files into, for a private
      repository whose storage branch shields cannot read. Only the
      numbers files are copied; the ledger stays on the branch. Off
      when empty. Make it a secret gist, since the numbers file carries
      the repository name.
    required: false
    default: ""
  gist_token:
    description: >-
      Classic personal access token with the gist scope, used for the
      gist mirror and nothing else. A fine-grained token cannot write a
      gist. When empty the token input is used, which only works if that
      token is itself a classic one with the gist scope.
    required: false
    default: ""
  allow-restart:
    description: >-
      Start a fresh ledger when the storage branch exists but its ledger
      file (or, with views on, its ledger) is missing, instead of
      refusing the run. That shape means another workflow rewrote the
      branch and deleted the ledger; set this to "true" for exactly one
      run to recover, then set it back to "false" or remove it, or the
      next real loss will look exactly like this recovery run and pass
      unnoticed.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # A runner downloads a `uses:` action as a tarball, which GitHub's
    # traffic counts never see. Fetching this repository with git at the
    # commit the consumer pinned makes every run of the action a clone of
    # it, so clonometer's own badge measures its use. The script then runs
    # from that checkout, so the fetch is what the run executes, not a
    # decoration. Plain git over https, no token: clonometer is public. A
    # local `uses: ./` has no action repository and skips it. The context
    # arrives through env because a nested action's inputs see that nested
    # action's own context, and a run body reads the values reliably only
    # through env. No prompt: a fetch that would ask for credentials is a
    # misconfiguration and must fail, never hang the runner.
    - name: fetch
      shell: bash
      env:
        CLONOMETER_ACTION_REPOSITORY: ${{ github.action_repository }}
        CLONOMETER_ACTION_REF: ${{ github.action_ref }}
        CLONOMETER_SERVER: ${{ github.server_url }}
        GIT_TERMINAL_PROMPT: "0"
      run: |
        set -euo pipefail
        if [ -z "${CLONOMETER_ACTION_REPOSITORY:-}" ]; then
          echo "local action, nothing to fetch"
          exit 0
        fi
        # RUNNER_TEMP, not the consumer's workspace: a checkout living there
        # would be source clonometer did not ask them to track, and a later
        # `git add -A` in their own workflow could commit it by mistake.
        dir="${RUNNER_TEMP}/clonometer-action"
        rm -rf "${dir}"
        git init --quiet "${dir}"
        git -C "${dir}" fetch --quiet --depth 1 \
          "${CLONOMETER_SERVER}/${CLONOMETER_ACTION_REPOSITORY}.git" "${CLONOMETER_ACTION_REF}"
        git -C "${dir}" checkout --quiet FETCH_HEAD
        echo "fetched ${CLONOMETER_ACTION_REPOSITORY} at ${CLONOMETER_ACTION_REF}"

    - name: count
      shell: bash
      env:
        CLONOMETER_TOKEN: ${{ inputs.token }}
        CLONOMETER_OUT: ${{ runner.temp }}/clonometer
        CLONOMETER_BRANCH: ${{ inputs.branch }}
        CLONOMETER_METRICS: ${{ inputs.metrics }}
        CLONOMETER_GIST: ${{ inputs.gist }}
        CLONOMETER_GIST_TOKEN: ${{ inputs.gist_token }}
        CLONOMETER_ALLOW_RESTART: ${{ inputs['allow-restart'] }}
        CLONOMETER_ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        # Belt and braces: the token is already a secret in the caller's
        # workflow, but masking it here too means it never shows up even
        # if something upstream forwarded it unmasked. The gist token is
        # masked the same way when there is one.
        echo "::add-mask::${CLONOMETER_TOKEN}"
        if [ -n "${CLONOMETER_GIST_TOKEN:-}" ]; then
          echo "::add-mask::${CLONOMETER_GIST_TOKEN}"
        fi
        set -euo pipefail
        # A composite action does not enforce a required input, so a missing
        # secret arrives as an empty string. Say so here, before the script
        # would fall back to the workflow token and fail with a message about
        # a permission that token can never have.
        if [ -z "${CLONOMETER_TOKEN}" ]; then
          echo "the token input is empty; set it to a fine-grained personal access token with Administration read and Contents write on this repository, stored as a repository secret" >&2
          exit 1
        fi
        # A branch input beginning with a dash could otherwise be parsed as
        # an option by a later git invocation instead of a ref. This is the
        # same check git itself uses to accept a branch name, so anything it
        # would refuse is refused here first, with a plain message naming
        # the input rather than a raw git fatal line.
        if ! git check-ref-format --branch "${CLONOMETER_BRANCH}" >/dev/null 2>&1; then
          echo "the branch input is not a valid branch name: ${CLONOMETER_BRANCH}" >&2
          exit 1
        fi
        # The fetched checkout when the fetch step ran, which is exactly when
        # the action has a repository name; the action's own path for a
        # local `uses: ./`. Kept under RUNNER_TEMP, never in the consumer's
        # workspace, so it is never what a `git add -A` in their own
        # workflow would find sitting there.
        if [ -n "${CLONOMETER_ACTION_REPOSITORY:-}" ]; then
          home="${RUNNER_TEMP}/clonometer-action"
        else
          home="${GITHUB_ACTION_PATH}"
        fi
        # --gist is passed only when the input is set, so a run without a
        # gist never mentions one to the script. The expansion form keeps
        # an empty array legal under set -u on every bash the runners ship.
        gist_args=()
        if [ -n "${CLONOMETER_GIST:-}" ]; then
          gist_args=(--gist "${CLONOMETER_GIST}")
        fi
        # Set only for the one recovery run the input's own description asks
        # for; any other value, including empty, leaves the guard armed.
        restart_args=()
        if [ "${CLONOMETER_ALLOW_RESTART:-false}" = "true" ]; then
          restart_args=(--allow-restart)
        fi
        python3 "${home}/clonometer.py" "${GITHUB_REPOSITORY}" --write "${CLONOMETER_OUT}" --branch "${CLONOMETER_BRANCH}" --metrics "${CLONOMETER_METRICS}" ${gist_args[@]+"${gist_args[@]}"} ${restart_args[@]+"${restart_args[@]}"}
        # The numbers on the run's summary page, so nobody has to open a log.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          python3 - "${CLONOMETER_OUT}" >> "${GITHUB_STEP_SUMMARY}" <<'PY'
        import json, pathlib, sys
        out = pathlib.Path(sys.argv[1])
        print("| Metric | Badge line | Last 14 days | Since |")
        print("| --- | --- | --- | --- |")
        for path in sorted(out.glob("*.json")):
            if path.name.endswith("-ledger.json"):
                continue
            doc = json.loads(path.read_text(encoding="utf-8"))
            print(f"| {doc['metric']} | {doc['badge']} | {doc['window']['count']} | {doc['since']} |")
        PY
          # The script has already PATCHed the gist by now, or exited 1.
          if [ -n "${CLONOMETER_GIST:-}" ]; then
            echo "" >> "${GITHUB_STEP_SUMMARY}"
            echo "Mirrored the numbers files to https://gist.github.com/${CLONOMETER_GIST}." >> "${GITHUB_STEP_SUMMARY}"
          fi
        fi

    - name: publish
      shell: bash
      env:
        CLONOMETER_TOKEN: ${{ inputs.token }}
        CLONOMETER_OUT: ${{ runner.temp }}/clonometer
        CLONOMETER_BRANCH: ${{ inputs.branch }}
        CLONOMETER_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
      run: |
        echo "::add-mask::${CLONOMETER_TOKEN}"
        set -euo pipefail

        # The token travels as a basic-auth header on each git call, the same
        # shape actions/checkout uses, so it never appears in the remote URL,
        # in a config file, or in any log line.
        auth="$(printf 'x-access-token:%s' "${CLONOMETER_TOKEN}" | base64 | tr -d '\n')"
        git_auth() { git -c http.extraheader="AUTHORIZATION: basic ${auth}" "$@"; }

        # A force push over the repository's default branch would erase its
        # history. Nothing a badge is worth, so refuse before touching anything.
        default="$(git_auth ls-remote --symref "${CLONOMETER_REMOTE}" HEAD 2>/dev/null \
          | sed -n 's|^ref: refs/heads/\(.*\)[[:space:]]HEAD$|\1|p' || true)"
        if [ -n "${default}" ] && [ "${default}" = "${CLONOMETER_BRANCH}" ]; then
          echo "refusing to force-push over ${CLONOMETER_BRANCH}, the repository's default branch; set the branch input to a storage branch such as badges" >&2
          exit 1
        fi

        # A throwaway directory under RUNNER_TEMP, not the checkout: the
        # storage branch has no history worth keeping, only the newest
        # numbers, so every run starts an orphan branch from scratch.
        work="$(mktemp -d "${RUNNER_TEMP}/clonometer-publish.XXXXXX")"
        git init --quiet --initial-branch="${CLONOMETER_BRANCH}" "${work}"
        git -C "${work}" config user.name 'github-actions[bot]'
        git -C "${work}" config user.email \
          '41898282+github-actions[bot]@users.noreply.github.com'

        # Files already on the branch that this run did not produce stay as
        # they are, so turning a metric off for a run does not erase the
        # ledger it built. The checkout stages them without giving the new
        # commit a parent.
        # A full ref, not a bare branch name: git parses a fetch refspec
        # that starts with a dash as an option rather than a ref, and the
        # count step already refused anything check-ref-format would not
        # accept as a branch, but a full ref never carries that ambiguity.
        if git_auth -C "${work}" fetch --quiet --depth 1 "${CLONOMETER_REMOTE}" \
          "refs/heads/${CLONOMETER_BRANCH}" 2>/dev/null; then
          git -C "${work}" checkout --quiet FETCH_HEAD -- .
        fi

        files=""
        for source in "${CLONOMETER_OUT}"/*; do
          name="$(basename "${source}")"
          # Remove whatever the branch had under this name first: a symlink
          # planted there would otherwise be followed by the copy.
          rm -f "${work}/${name}"
          cp "${source}" "${work}/${name}"
          git -C "${work}" add "${name}"
          files="${files} ${name}"
        done

        git -C "${work}" commit --quiet \
          -m "clonometer:${files} as of $(date -u +%Y-%m-%d)"

        # Why a PAT and not GITHUB_TOKEN: the traffic endpoints sit behind
        # Administration read, a permission a workflow token cannot hold.
        # Why force push: the branch carries only the latest numbers, so
        # each run's single commit replaces the one before it rather than
        # accumulating a history nobody reads.
        if ! git_auth -C "${work}" push --force --quiet "${CLONOMETER_REMOTE}" \
          "HEAD:${CLONOMETER_BRANCH}"; then
          echo "the push to the ${CLONOMETER_BRANCH} branch was refused; the token needs Contents write on this repository" >&2
          exit 1
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published${files} to the ${CLONOMETER_BRANCH} branch as commit $(git -C "${work}" rev-parse --short HEAD)." >> "${GITHUB_STEP_SUMMARY}"
        fi
