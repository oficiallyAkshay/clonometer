name: clonometer
description: A lifetime clone count for any repository, in a JSON file you can badge any way you like.
branding:
  icon: trending-up
  color: green

inputs:
  token:
    description: >-
      Fine-grained personal access token with Administration read and
      Contents write on this repository. A workflow's own GITHUB_TOKEN
      cannot be granted Administration, which is where the traffic
      endpoints sit, so this has to be a token the owner creates.
    required: true
  branch:
    description: Branch the ledger and numbers files are kept on.
    required: false
    default: badges
  metrics:
    description: Metrics to count, 'clones' or 'clones,views'.
    required: false
    default: clones

runs:
  using: composite
  steps:
    # A runner downloads a `uses:` action as a tarball, which GitHub's
    # traffic counts never see. Fetching this repository with git at the
    # commit the consumer pinned makes every run of the action a clone of
    # it, so clonometer's own badge measures its use. The script then runs
    # from that checkout, so the fetch is what the run executes, not a
    # decoration. A local `uses: ./` has no action repository and skips it.
    - name: fetch
      if: github.action_repository != ''
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ github.action_repository }}
        ref: ${{ github.action_ref }}
        path: .clonometer
        persist-credentials: false
        fetch-depth: 1

    - name: count
      shell: bash
      env:
        CLONOMETER_TOKEN: ${{ inputs.token }}
        CLONOMETER_OUT: ${{ runner.temp }}/clonometer
        CLONOMETER_BRANCH: ${{ inputs.branch }}
        CLONOMETER_METRICS: ${{ inputs.metrics }}
        CLONOMETER_ACTION_REPOSITORY: ${{ github.action_repository }}
      run: |
        # Belt and braces: the token is already a secret in the caller's
        # workflow, but masking it here too means it never shows up even
        # if something upstream forwarded it unmasked.
        echo "::add-mask::${CLONOMETER_TOKEN}"
        set -euo pipefail
        # A composite action does not enforce a required input, so a missing
        # secret arrives as an empty string. Say so here, before the script
        # would fall back to the workflow token and fail with a message about
        # a permission that token can never have.
        if [ -z "${CLONOMETER_TOKEN}" ]; then
          echo "the token input is empty; set it to a fine-grained personal access token with Administration read and Contents write on this repository, stored as a repository secret" >&2
          exit 1
        fi
        # The fetched checkout when the fetch step ran, which is exactly when
        # the action has a repository name; the action's own path for a
        # local `uses: ./`. Decided by the context, never by what happens
        # to sit in the consumer's workspace.
        if [ -n "${CLONOMETER_ACTION_REPOSITORY:-}" ]; then
          home="${GITHUB_WORKSPACE}/.clonometer"
        else
          home="${GITHUB_ACTION_PATH}"
        fi
        python3 "${home}/clonometer.py" "${GITHUB_REPOSITORY}" --write "${CLONOMETER_OUT}" --branch "${CLONOMETER_BRANCH}" --metrics "${CLONOMETER_METRICS}"
        # The numbers on the run's summary page, so nobody has to open a log.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          python3 - "${CLONOMETER_OUT}" >> "${GITHUB_STEP_SUMMARY}" <<'PY'
        import json, pathlib, sys
        out = pathlib.Path(sys.argv[1])
        print("| Metric | Badge line | Last 14 days | Since |")
        print("| --- | --- | --- | --- |")
        for path in sorted(out.glob("*.json")):
            if path.name.endswith("-ledger.json"):
                continue
            doc = json.loads(path.read_text(encoding="utf-8"))
            print(f"| {doc['metric']} | {doc['badge']} | {doc['window']['count']} | {doc['since']} |")
        PY
        fi

    - name: publish
      shell: bash
      env:
        CLONOMETER_TOKEN: ${{ inputs.token }}
        CLONOMETER_OUT: ${{ runner.temp }}/clonometer
        CLONOMETER_BRANCH: ${{ inputs.branch }}
        CLONOMETER_REMOTE: ${{ github.server_url }}/${{ github.repository }}.git
      run: |
        echo "::add-mask::${CLONOMETER_TOKEN}"
        set -euo pipefail

        # The token travels as a basic-auth header on each git call, the same
        # shape actions/checkout uses, so it never appears in the remote URL,
        # in a config file, or in any log line.
        auth="$(printf 'x-access-token:%s' "${CLONOMETER_TOKEN}" | base64 | tr -d '\n')"
        git_auth() { git -c http.extraheader="AUTHORIZATION: basic ${auth}" "$@"; }

        # A force push over the repository's default branch would erase its
        # history. Nothing a badge is worth, so refuse before touching anything.
        default="$(git_auth ls-remote --symref "${CLONOMETER_REMOTE}" HEAD 2>/dev/null \
          | sed -n 's|^ref: refs/heads/\(.*\)[[:space:]]HEAD$|\1|p' || true)"
        if [ -n "${default}" ] && [ "${default}" = "${CLONOMETER_BRANCH}" ]; then
          echo "refusing to force-push over ${CLONOMETER_BRANCH}, the repository's default branch; set the branch input to a storage branch such as badges" >&2
          exit 1
        fi

        # A throwaway directory under RUNNER_TEMP, not the checkout: the
        # storage branch has no history worth keeping, only the newest
        # numbers, so every run starts an orphan branch from scratch.
        work="$(mktemp -d "${RUNNER_TEMP}/clonometer-publish.XXXXXX")"
        git init --quiet --initial-branch="${CLONOMETER_BRANCH}" "${work}"
        git -C "${work}" config user.name 'github-actions[bot]'
        git -C "${work}" config user.email \
          '41898282+github-actions[bot]@users.noreply.github.com'

        # Files already on the branch that this run did not produce stay as
        # they are, so turning a metric off for a run does not erase the
        # ledger it built. The checkout stages them without giving the new
        # commit a parent.
        if git_auth -C "${work}" fetch --quiet --depth 1 "${CLONOMETER_REMOTE}" \
          "${CLONOMETER_BRANCH}" 2>/dev/null; then
          git -C "${work}" checkout --quiet FETCH_HEAD -- .
        fi

        files=""
        for source in "${CLONOMETER_OUT}"/*; do
          name="$(basename "${source}")"
          # Remove whatever the branch had under this name first: a symlink
          # planted there would otherwise be followed by the copy.
          rm -f "${work}/${name}"
          cp "${source}" "${work}/${name}"
          git -C "${work}" add "${name}"
          files="${files} ${name}"
        done

        git -C "${work}" commit --quiet \
          -m "clonometer:${files} as of $(date -u +%Y-%m-%d)"

        # Why a PAT and not GITHUB_TOKEN: the traffic endpoints sit behind
        # Administration read, a permission a workflow token cannot hold.
        # Why force push: the branch carries only the latest numbers, so
        # each run's single commit replaces the one before it rather than
        # accumulating a history nobody reads.
        if ! git_auth -C "${work}" push --force --quiet "${CLONOMETER_REMOTE}" \
          "HEAD:${CLONOMETER_BRANCH}"; then
          echo "the push to the ${CLONOMETER_BRANCH} branch was refused; the token needs Contents write on this repository" >&2
          exit 1
        fi
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          echo "" >> "${GITHUB_STEP_SUMMARY}"
          echo "Published${files} to the ${CLONOMETER_BRANCH} branch as commit $(git -C "${work}" rev-parse --short HEAD)." >> "${GITHUB_STEP_SUMMARY}"
        fi
