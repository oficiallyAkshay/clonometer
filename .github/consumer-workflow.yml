# GitHub disables a scheduled workflow on a public repository after 60 days
# with no commit to the repository; any commit, on any branch, resets that
# clock, so a repository that commits regularly never sees this schedule
# stop.
#
# The schedule ticks every hour and the action counts only on its run slots,
# twice a day unless the repository variable CLONOMETER_RUNS_PER_DAY says
# otherwise (1 to 24, set under Settings, Secrets and variables, Actions,
# Variables). A tick that is not a slot ends in seconds without a clone.
name: clonometer
on:
  schedule: [{cron: "17 * * * *"}]
  workflow_dispatch:
permissions: {}
concurrency: {group: clonometer}
jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: oficiallyAkshay/clonometer@<sha>   # pinned commit
        with:
          token: ${{ secrets.TRAFFIC_TOKEN }}
          runs-per-day: ${{ vars.CLONOMETER_RUNS_PER_DAY }}
