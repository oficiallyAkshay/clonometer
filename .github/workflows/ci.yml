name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A second push to a pull request supersedes the first, so cancel the run it
# replaced. Pushes to main are never cancelled: every commit on the default
# branch keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One runner for everything that reads the tree without running the test
  # suite: hooks, secrets over the whole history, dependency audit.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # gitleaks reads pull request metadata to report what it finds.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans the whole history, not the working tree.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      # The actionlint hook is built from Go source on first use, about
      # twenty seconds on a fresh runner and most of this job's time. The
      # hook cache is keyed on the config, so a bump rebuilds it once.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv sync --all-extras

      # The same hooks contributors run locally, so CI and the pre-commit
      # config cannot drift: ruff, vulture, deptry, zizmor, actionlint and the
      # prose gate. gitleaks is skipped here because the step below scans the
      # whole history rather than the working tree.
      - name: pre-commit hooks
        run: SKIP=gitleaks uv run pre-commit run --all-files --show-diff-on-failure

      # pinact has no pre-commit hook of its own to pin to, so it runs as its
      # own step: every `uses:` must be a full commit SHA, and that SHA must
      # actually be the commit the trailing version comment names, never a
      # hand-edited or stale one. fix: "false" only checks; it never rewrites
      # a workflow file or pushes a commit.
      - name: verify actions are pinned
        uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
        with:
          fix: "false"
          verify: "true"
          excludes: |
            ^oficiallyAkshay/clonometer$

      - name: secrets scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Audit the resolved dependency set against the advisory database. The
      # runtime has none, so this is the dev tooling. A known vulnerability
      # fails the job.
      - name: dependency audit
        run: |
          uv export --format requirements-txt --all-extras \
            --no-emit-project > "${RUNNER_TEMP}/requirements.txt"
          uvx pip-audit --requirement "${RUNNER_TEMP}/requirements.txt"

  # The declared floor and the newest release. Both legs run to completion so
  # a version-specific failure is visible on its own.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Codecov uploads with an OIDC token rather than a repository secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # diff-cover needs history on both sides to find a merge base.
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uv sync --all-extras
      - run: uv run pytest --cov --cov-report=xml --cov-report=term

      # One report per run, so only the newest leg uploads. The upload is
      # tokenless: it authenticates with the job's OIDC identity, which
      # Codecov accepts from a public repository. A Codecov outage must not
      # block a merge, so the step reports and moves on.
      - name: upload coverage
        if: matrix.python-version == '3.13'
        uses: codecov/codecov-action@0b35c9ecc4f0529d0eb674914510c22f85b196b4 # v7.1.0
        with:
          use_oidc: true
          files: coverage.xml
          fail_ci_if_error: false

      - name: diff coverage
        if: github.event_name == 'pull_request'
        # Fetch main in full. A shallow fetch leaves no commit in common with
        # a rebased branch, and diff-cover then has no merge base to compare
        # against.
        run: |
          git fetch origin main
          uv run diff-cover coverage.xml --compare-branch=origin/main --fail-under=100

  # The one context the branch ruleset requires. It exists on every run, forks
  # included, and it is the only job name the ruleset needs to know.
  ci:
    needs: [checks, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: gate
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: ${RESULTS}"
          for result in ${RESULTS}; do
            if [ "${result}" != "success" ]; then
              echo "a required job did not succeed" >&2
              exit 1
            fi
          done
