# OSSF Scorecard rates the repository's own supply-chain hygiene (branch
# protection, pinned actions, review coverage) and publishes the score.
# Advisory only: nothing here blocks a merge.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    # Weekly, off the dogfood workflow's own schedule (17 3 * * *) and the
    # codeql schedule so none of the three compete for a runner minute.
    - cron: "38 5 * * 3"

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Scorecard authenticates its publish with the job's OIDC identity
      # rather than a repository secret.
      id-token: write
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@55891bbd73f2425e97637d96e306fc9d491d0b21 # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          sarif_file: results.sarif
