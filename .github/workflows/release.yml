# There are no release tags yet, so publishing only ever happens by a manual
# dispatch, never automatically. Before the first run the owner must
# configure a pending trusted publisher for project clonometer, workflow
# release.yml, environment release, on both PyPI and npm; neither registry
# accepts these jobs' OIDC identity without that being set up first.
name: release

on:
  workflow_dispatch:

permissions: {}

jobs:
  pypi:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      # Trusted publishing exchanges this job's OIDC token for a PyPI upload
      # token; there is no PyPI API token stored in this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: "3.12"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      # Trusted publishing exchanges this job's OIDC token for a short-lived
      # npm publish token; NODE_AUTH_TOKEN is deliberately never set.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5 or newer, which no Node release
      # bundles reliably, so the client is pinned here rather than inherited.
      - run: npm install --global npm@12.0.2 # zizmor: ignore[adhoc-packages] pins the npm CLI itself, not a project dependency; there is no manifest for it
      - run: npm publish --provenance --access public
