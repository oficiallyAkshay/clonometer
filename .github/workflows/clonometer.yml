# The consumer workflow every other repository adds, unchanged except that
# it follows main instead of a pinned commit, since this repository is main.
name: clonometer

on:
  schedule: [{cron: "17 3 * * *"}]
  workflow_dispatch:

permissions: {}

concurrency: {group: clonometer}

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The job never touches GITHUB_TOKEN: the action authenticates with the
    # TRAFFIC_TOKEN input, a personal access token, for every read and every
    # write, so the workflow token needs no permission of its own.
    permissions: {}
    steps:
      # The action fetches this repository itself, at the commit named
      # here, so the dogfood run takes the same path every consumer takes:
      # no checkout, no permissions, one line. It follows main rather than
      # a pinned commit because this repository is main.
      - uses: oficiallyAkshay/clonometer@main # zizmor: ignore[unpinned-uses] this repo is main; a pinned commit here would be main pinning itself
        with:
          # A fine-grained personal access token with Administration read
          # and Contents write, scoped to this repository only, stored as
          # the TRAFFIC_TOKEN secret. A workflow's own GITHUB_TOKEN cannot
          # be granted Administration, which is where the traffic endpoints
          # sit.
          token: ${{ secrets.TRAFFIC_TOKEN }}
          metrics: clones,views
