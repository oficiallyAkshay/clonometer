name: readme check

on:
  push:
  pull_request:
  schedule:
    - cron: "0 9 * * 1"

permissions: {}

# A second push to a pull request supersedes the first, so cancel the run it
# replaced. Pushes to main key on the commit instead, so a rapid second push
# gets its own group rather than dropping the first push's run.
concurrency:
  group: readme-check-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  readmerlin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # exec runs the count-source commands from readmerlin.json so every
      # count badge is verified against the tree on every push, not only
      # when checked by hand. The one command here (python3's stdlib
      # tomllib) needs 3.11+; ubuntu-latest's own python3 already resolves
      # to 3.12 (see ci.yml's test matrix comment), so no extra setup step
      # is needed.
      - uses: oficiallyAkshay/readmerlin@63f78b5379bcdeff23a443ecf165ceb43544eebb # v1.0.2
        with:
          exec: "true"
